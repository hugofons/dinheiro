<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dinheiro · escolher tema</title>
    <style>
      :root { --fundo: #e4e6e1; --cartao: #f7f7f5; --texto: #1c1f1d; --texto-2: #5f6661; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --fundo: #121412; --cartao: #1b1e1b; --texto: #eef1ee; --texto-2: #a3aba5; } }
      body { margin: 0; background: var(--fundo); color: var(--texto); font: 16px/1.4 system-ui, sans-serif; padding: 32px 16px; }
      h1 { margin: 0 auto 4px; max-width: 1240px; font-size: 1.6rem; }
      .intro { margin: 0 auto 28px; max-width: 1240px; color: var(--texto-2); }
      .tema { max-width: 1240px; margin: 0 auto 32px; background: var(--cartao); border-radius: 28px; padding: 24px; }
      .tema h2 { margin: 0 0 4px; font-size: 1.3rem; }
      .tema p { margin: 0 0 20px; color: var(--texto-2); }
      .ecras { display: flex; gap: 24px; overflow-x: auto; padding-bottom: 8px; }
      figure { margin: 0; flex: none; }
      figcaption { font-size: 0.85rem; color: var(--texto-2); margin-bottom: 8px; }
      iframe { width: 375px; height: 812px; border: 0; border-radius: 32px; box-shadow: 0 8px 40px rgb(0 0 0 / 0.14); background: #05060c; }
    </style>
  </head>
  <body>
    <h1>Escolhe o tema</h1>
    <p class="intro">Cada ecrã é a app real a funcionar: podes tocar, abrir o formulário e mudar de separador.</p>
    <div id="temas"></div>
    <script>
      const temas = [
        ['vidro-aurora', 'Liquid glass · Aurora', 'Violeta, azul-céu e verde-esmeralda.'],
        ['vidro-oceano', 'Liquid glass · Oceano', 'Azul profundo, ciano e verde-água.'],
        ['vidro-por-do-sol', 'Liquid glass · Pôr do sol', 'Laranja, rosa-magenta e roxo.'],
        ['vidro-floresta', 'Liquid glass · Floresta', 'Verde-esmeralda, lima e verde-petróleo.'],
        ['vidro-rubi', 'Liquid glass · Rubi', 'Vermelho-rubi, carmim e um toque de âmbar.'],
        ['vidro-cosmos', 'Liquid glass · Cosmos', 'Magenta, índigo e ciano.'],
        ['noite', 'Para comparar: o vidro escuro anterior', 'O tema de que gostaste, sem o efeito liquid glass.'],
      ];
      const ecras = [['', 'Mês'], ['novo', 'Novo movimento'], ['evolucao', 'Evolução']];
      const resumo = `<section class="tema"><h2>Visão geral</h2><p>O ecrã Mês em cada gradiente. Mais abaixo tens cada um com três ecrãs.</p><div class="ecras">${temas.filter(([t]) => t.startsWith('vidro')).map(([t, nome]) => `<figure><figcaption>${nome.replace('Liquid glass · ', '')}</figcaption><iframe loading="lazy" src="./?tema=${t}"></iframe></figure>`).join('')}</div></section>`;
      document.getElementById('temas').innerHTML = resumo + temas
        .map(([t, nome, desc]) => `<section class="tema"><h2>${nome}</h2><p>${desc}</p><div class="ecras">${ecras
          .map(([e, n]) => `<figure><figcaption>${n}</figcaption><iframe loading="lazy" src="./?${new URLSearchParams({ ...(t && { tema: t }), ...(e && { ecra: e }) })}"></iframe></figure>`)
          .join('')}</div></section>`)
        .join('');
    </script>
  </body>
</html>
